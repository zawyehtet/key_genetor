
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Offline Key Generator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            color: #1a1a1a;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
        }
        .btn-generate {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-generate:hover {
            background-color: #1d4ed8;
        }
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 22px 0;
        }
        .key-container {
            display: flex;
            gap: 8px;
        }
        .key-field {
            flex: 1;
            background-color: #f9fafb;
            color: #059669;
            font-weight: 700;
            font-size: 16px;
            border: 1.5px solid #10b981 !important;
            cursor: text;
        }
        .btn-copy {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        .btn-copy:hover {
            background-color: #059669;
        }
        .toast {
            text-align: center;
            font-size: 12px;
            color: #059669;
            margin-top: 6px;
            min-height: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>License Key Generator</h2>

    <div class="form-group">
        <label for="deviceId">Device ID (ဖုန်းထဲက ID ထည့်ပါ)</label>
        <input type="text" id="deviceId" placeholder="ဥပမာ- 9F8A1B2C3D4E" autocomplete="off" spellcheck="false">
    </div>

    <button class="btn-generate" onclick="generateKey()">Generate Key ထုတ်မည်</button>

    <div class="divider"></div>

    <div class="form-group">
        <label for="outputKey">Generated Activation Key</label>
        <div class="key-container">
            <input type="text" id="outputKey" class="key-field" readonly placeholder="XXXX-XXXX-XXXX">
            <button class="btn-copy" id="btnCopy" onclick="copyKey()">Copy</button>
        </div>
        <div class="toast" id="toastMsg"></div>
    </div>
</div>

<script>
    // Android Kotlin ဘက်နှင့် စာလုံးအကြီးအသေး အတိအကျ တူရမည်
    const SHARED_SECRET = "MY_VERY_SECURE_COMPANY_OFFLINE_SECRET_2026";

    // ပြင်ပ Library မလိုဘဲ အော့ဖ်လိုင်း HMAC-SHA256 တွက်ချက်ခြင်း
    async function computeHmacSha256(keyStr, messageStr) {
        const enc = new TextEncoder();
        const keyData = enc.encode(keyStr);
        const msgData = enc.encode(messageStr);

        const cryptoKey = await window.crypto.subtle.importKey(
            "raw",
            keyData,
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"]
        );

        const signature = await window.crypto.subtle.sign("HMAC", cryptoKey, msgData);
        const hashArray = Array.from(new Uint8Array(signature));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    async function generateKey() {
        const deviceIdInput = document.getElementById('deviceId');
        const outputField = document.getElementById('outputKey');
        const toast = document.getElementById('toastMsg');
        
        const deviceId = deviceIdInput.value.trim().toUpperCase();
        
        if (!deviceId) {
            alert("Device ID အရင် ရိုက်ထည့်ပေးပါ");
            deviceIdInput.focus();
            return;
        }

        try {
            const hex = await computeHmacSha256(SHARED_SECRET, deviceId);
            const rawKey = hex.substring(0, 12);
            const formattedKey = `${rawKey.substring(0, 4)}-${rawKey.substring(4, 8)}-${rawKey.substring(8, 12)}`;
            
            outputField.value = formattedKey;
            toast.innerText = "";
        } catch (err) {
            alert("တွက်ချက်မှု အမှားဖြစ်ပေါ်ပါသည်: " + err.message);
        }
    }

    function copyKey() {
        const outputField = document.getElementById('outputKey');
        const toast = document.getElementById('toastMsg');
        const btnCopy = document.getElementById('btnCopy');

        if (!outputField.value) {
            alert("Key မထုတ်ရသေးပါ");
            return;
        }

        outputField.select();
        navigator.clipboard.writeText(outputField.value).then(() => {
            btnCopy.innerText = "Copied!";
            toast.innerText = "Key ကို Clipboard သို့ Copy ကူးပြီးပါပြီ";
            setTimeout(() => {
                btnCopy.innerText = "Copy";
                toast.innerText = "";
            }, 2000);
        }).catch(() => {
            // Clipboard API မရပါက Fallback သုံးခြင်း
            document.execCommand('copy');
            btnCopy.innerText = "Copied!";
            setTimeout(() => { btnCopy.innerText = "Copy"; }, 2000);
        });
    }
</script>

</body>
</html>
